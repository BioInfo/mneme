# Session Recall Configuration
# Copy this file to config.yaml and adjust paths for your system

# Session file locations
sources:
  - path: "~/.claude/projects"
    name: "local"

# Vector database location
vectordb:
  path: "./data/lance"

# Embedding model
embeddings:
  model: "nomic-ai/nomic-embed-text-v1.5"
  dimension: 768
  device: "cpu"  # Options: "cpu", "cuda", "mps" (Mac Metal)

# Indexing settings
indexing:
  batch_size: 100
  min_content_length: 20      # Skip very short content
  max_content_length: 2000    # Truncate very long content
  skip_agent_sessions: false  # Include agent-*.jsonl files
  skip_patterns:              # Files to ignore
    - "*.tmp"

# Search settings
search:
  default_limit: 10
  group_by_session: true
  include_similarity_score: true

# Reranking (used by --mode rerank): a local cross-encoder reorders the
# top candidates from hybrid retrieval. Runs fully locally, downloads on
# first use. Optional — defaults below apply if this section is omitted.
rerank:
  model: "BAAI/bge-reranker-v2-m3"  # strong, ~560MB. Lighter: cross-encoder/ms-marco-MiniLM-L-6-v2 (~80MB)
  candidates: 50                    # how many to retrieve before reranking
  device: "cpu"                     # "cpu", "cuda", or "mps" (Mac Metal)
